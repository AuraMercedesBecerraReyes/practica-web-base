<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica web — Informática III</title>
  </head>
  <body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

    <!-- EJERCICIO 1: construye aquí tu página (header, main con #catalogo, footer).
         Las instrucciones están en el README. -->
         <header class = "bg-blue-950 py-6 text-center shadow-sm"> 
            <h1 class = "font-bold text-blue-100 text-lg"> Alitach</h1>
            <p class = "text-sm text-gray-100"> Taller de creación y personalización textil</p>
         </header>
         <main class = "max-w-6xl mx-auto px-4 py-8 flex-grow w-full"> 
          <div id="categorias" class = "flex gap-2 my-4 justify-center">
            <button data-categoria="Todos" class = "bg-blue-600 text-white font-semibold py-2 px-4 rounded">
              Todos
            </button>
            <button data-categoria="Chalecos" class = "bg-white text-blue-600 font-semibold py-2 px-4 rounded">
              Chalecos
            </button>
             <button data-categoria="Bolsas" class = "bg-white text-blue-600 font-semibold py-2 px-4 rounded">
              Bolsas
            </button>
             <button data-categoria="Personalización" class = "bg-white text-blue-600 font-semibold py-2 px-4 rounded">
              Personalización
            </button>
          </div>

            <div id="catalogo" class = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"> 
            </div>

          <section class="mt-8 p-4">
  <h2 class="text-lg font-bold text-center text-gray-700">Pedidos registrados</h2>
  <div id="filtros-pedidos" class="flex gap-2 my-4 justify-center">
    <button data-filtro-estado="Todos" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded cursor-pointer">
      Todos (<span id="cant-Todos">0</span>)
    </button>
    <button data-filtro-estado="Pendiente" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded cursor-pointer">
      Pendientes (<span id="cant-Pendiente">0</span>)
    </button>
    <button data-filtro-estado="En preparación" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded cursor-pointer">
      En preparación (<span id="cant-En-preparacion">0</span>)
    </button>
    <button data-filtro-estado="Entregado" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded cursor-pointer">
      Entregado (<span id="cant-Entregado">0</span>)
    </button>
  </div>
  <div id="pedidos-registrados"> </div>
</section>

            <aside class = "bg-blue-200 rounded-lg shadow p-4 flex flex-col justify-between transition duration-200 hover:shadow-md">
              <h2  class = "text-lg font-bold text-center text-gray-700">Mi pedido</h2>
              <ul id="lista-pedido">

              </ul>
              <p id="total" class = "font-bold text-gray-700 mt-2"> </p>

              <form id="form-cliente">
                <div class="text-center">
                  <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre: </label>
                  <input id="nombre" class=" border rounded">
                  <p id="error-nombre" class="text-sm text-red-500 hidden"></p>
                </div>

                <div class="text-center">
                  <label for="telefono" class=" block text-sm font-medium text-gray-700">Teléfono: </label>
                  <input id="telefono" class=" border rounded">
                  <p id="error-telefono" class="text-sm text-red-500 hidden"></p>
                </div>
                <div class="text-center">
                  <label for="correo" class="block text-sm font-medium text-gray-700">Correo: </label>
                  <input id="correo" class=" border rounded">
                  <p id="error-correo" class="text-sm text-red-500 hidden"></p>
                </div>
                <p id="error-pedido" class="text-sm text-red-600 hidden text-center font-semibold"></p>
                <button type="submit" class=" w-full mt-4 bg-green-600 text-white p-2 rounded hover:bg-green-700 transition">Confirmar pedido</button>
                <p id="exito-pedido" class="text-sm text-green-800 hidden text-center font-semibold"></p>
              </form>
             <button id="btn-vaciar" class = "w-full mt-4 bg-gray-600 text-white font-semibold py-2 px-4 rounded-md transition-colors duration-200 hover:bg-gray-500 cursor-pointer">
              Vaciar pedido
              </button>
          </aside>

          </main>
         
          <footer class = "bg-blue-950 text-white text-center text-xs py-4">
            <p> Equipo ASKI </p>
          </footer>
          
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
